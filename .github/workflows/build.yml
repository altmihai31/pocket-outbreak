name: Build ROM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Check out (with the Butano submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Pillow for the asset generator
        run: apt-get update && apt-get install -y --no-install-recommends python3-pil

      - name: Build knox.gba
        working-directory: knox-gba
        run: make -j"$(nproc)" PYTHON=python3

      - name: Package
        run: |
          mkdir dist
          cp knox-gba/knox.gba dist/pocket-outbreak.gba
          cp "knox-gba/showcase/Pocket Outbreak.png" "dist/Pocket Outbreak.png"
          ls -la dist

      - name: Upload the ROM
        uses: actions/upload-artifact@v4
        with:
          name: pocket-outbreak-${{ github.sha }}
          path: dist/

      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pocket-outbreak.gba
            dist/Pocket Outbreak.png
          generate_release_notes: true
