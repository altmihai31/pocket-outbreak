name: Build ROM

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Check out (with the Butano submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Pillow for the asset generator
        run: apt-get update && apt-get install -y --no-install-recommends python3-pil

      - name: Build knox.gba
        working-directory: knox-gba
        run: make -j"$(nproc)" PYTHON=python3

      - name: Build the save bench (knox_save.gba)
        working-directory: knox-gba
        run: make -j"$(nproc)" PYTHON=python3 BENCH=8

      - name: Package
        run: |
          mkdir dist
          cp knox-gba/knox.gba dist/pocket-outbreak.gba
          cp "knox-gba/showcase/Pocket Outbreak.png" "dist/Pocket Outbreak.png"
          ls -la dist

      - name: Upload the ROM
        uses: actions/upload-artifact@v4
        with:
          name: pocket-outbreak-${{ github.sha }}
          path: dist/

      - name: Upload the save bench
        uses: actions/upload-artifact@v4
        with:
          name: save-bench
          path: knox-gba/knox_save.gba

  save-test:
    # Plays the save bench headless in mGBA: save a world, load it, and fail if anything came back different.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mGBA
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mgba-sdl

      - uses: actions/download-artifact@v4
        with:
          name: save-bench

      - name: Save round trip
        run: python3 knox-gba/tools/save_roundtrip_test.py knox_save.gba --mgba /usr/games/mgba --log knox_save.log

      - name: Upload the bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-bench-log
          path: knox_save.log

  release:
    # Tags only, and only once the save test has passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, save-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocket-outbreak-${{ github.sha }}
          path: dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pocket-outbreak.gba
            dist/Pocket Outbreak.png
          generate_release_notes: true
