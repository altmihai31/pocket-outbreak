<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Health and status</title>
<!-- Static export of the design canvas artboard "Health.dc.html". GBA screen 240x160 shown at 3x (720x480). -->
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e8c547}a:hover{color:#ffffff}
</style>
</head>
<body style="background:#05070b;display:flex;justify-content:center;align-items:center;min-height:100vh">
<div style="width:720px;height:480px;position:relative;overflow:hidden;background:#10141b;font-family:'Silkscreen',monospace;color:#e8e4d8">

  <div style="position:absolute;left:36px;right:36px;top:12px;height:42px;box-sizing:border-box;padding:0 12px;background:#0b0e14;border:3px solid #2a2f3a;display:flex;align-items:center;justify-content:space-between;font-size:16px">
    <span style="color:#a8b0bc">L</span>
    <div style="display:flex;gap:18px;align-items:center">
      <span style="color:#8a929e">GEAR</span>
      <span style="color:#0b0e14;background:#e8c547;padding:0 9px;line-height:24px">HEALTH</span>
      <span style="color:#8a929e">CRAFT</span>
      <span style="color:#8a929e">SKILLS</span>
      <span style="color:#8a929e">MAP</span>
    </div>
    <span style="color:#a8b0bc">R</span>
  </div>

  <div style="position:absolute;left:36px;top:66px;width:216px;height:354px;box-sizing:border-box;padding:12px;background:#0b0e14;border:3px solid #2a2f3a;display:flex;flex-direction:column;align-items:center;gap:12px">
    <svg width="144" height="252" viewBox="0 0 16 28" shape-rendering="crispEdges" role="img" aria-label="Body diagram, left arm bleeding">
      <rect x="6" y="0" width="4" height="4" fill="#6b7a8a"></rect>
      <rect x="7" y="4" width="2" height="1" fill="#6b7a8a"></rect>
      <rect x="4" y="5" width="8" height="9" fill="#6b7a8a"></rect>
      <rect x="2" y="5" width="2" height="9" fill="#6b7a8a"></rect>
      <rect x="2" y="14" width="2" height="2" fill="#6b7a8a"></rect>
      <rect x="12" y="5" width="2" height="9" fill="#d0453a"></rect>
      <rect x="12" y="14" width="2" height="2" fill="#d0453a"></rect>
      <rect x="13" y="17" width="1" height="1" fill="#d0453a"></rect><rect x="12" y="19" width="1" height="1" fill="#d0453a"></rect>
      <rect x="5" y="14" width="3" height="12" fill="#6b7a8a"></rect>
      <rect x="8" y="14" width="3" height="12" fill="#6b7a8a"></rect>
      <rect x="4" y="26" width="4" height="2" fill="#6b7a8a"></rect><rect x="8" y="26" width="4" height="2" fill="#6b7a8a"></rect>
      <rect x="7" y="5" width="2" height="9" fill="#5d6b7a"></rect>
    </svg>
    <span style="font-size:16px;line-height:18px;color:#f08a80;text-align:center">L ARM<br>BLEEDING</span>
  </div>

  <div style="position:absolute;left:264px;top:66px;width:420px;height:354px;box-sizing:border-box;padding:12px 15px;background:#0b0e14;border:3px solid #2a2f3a;display:flex;flex-direction:column;gap:15px">
    
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:16px;line-height:18px">
          <span>BLOOD</span>
          <span style="color:#e8e4d8">3800 / 5000 ML</span>
        </div>
        <div style="height:18px;box-sizing:border-box;border:3px solid #2a2f3a;background:#151a22">
          <div style="width:76%;height:12px;background:#d0453a"></div>
        </div>
      </div>
    
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:16px;line-height:18px">
          <span>FOOD</span>
          <span style="color:#e8e4d8">42 %</span>
        </div>
        <div style="height:18px;box-sizing:border-box;border:3px solid #2a2f3a;background:#151a22">
          <div style="width:42%;height:12px;background:#d98a3a"></div>
        </div>
      </div>
    
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:16px;line-height:18px">
          <span>WATER</span>
          <span style="color:#f0b066">18 % · THIRSTY</span>
        </div>
        <div style="height:18px;box-sizing:border-box;border:3px solid #2a2f3a;background:#151a22">
          <div style="width:18%;height:12px;background:#4a90d9"></div>
        </div>
      </div>
    
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:16px;line-height:18px">
          <span>BODY TEMP</span>
          <span style="color:#a8d0f0">35.8 °C · COLD</span>
        </div>
        <div style="height:18px;box-sizing:border-box;border:3px solid #2a2f3a;background:#151a22">
          <div style="width:38%;height:12px;background:#7fb0e0"></div>
        </div>
      </div>
    
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:16px;line-height:18px">
          <span>CARRY</span>
          <span style="color:#e8e4d8">11.2 / 20.0 KG</span>
        </div>
        <div style="height:18px;box-sizing:border-box;border:3px solid #2a2f3a;background:#151a22">
          <div style="width:56%;height:12px;background:#a8b0bc"></div>
        </div>
      </div>
    
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:3px">
      <span style="font-size:16px;line-height:24px;padding:0 9px;border:3px solid #d0453a;color:#f08a80">BLEEDING</span>
      <span style="font-size:16px;line-height:24px;padding:0 9px;border:3px solid #7fb0e0;color:#a8d0f0">COLD</span>
      <span style="font-size:16px;line-height:24px;padding:0 9px;border:3px solid #e0903a;color:#f0b066">THIRSTY</span>
    </div>
  </div>

  <div style="position:absolute;left:36px;right:36px;top:438px;display:flex;gap:30px;font-size:16px;line-height:24px;color:#a8b0bc">
    <span><span style="color:#e8e4d8">A</span> APPLY BANDAGE (2)</span>
    <span><span style="color:#e8e4d8">B</span> BACK</span>
  </div>
</div>
</body>
</html>
